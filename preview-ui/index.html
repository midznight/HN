<title>Our Space — Pratinjau UI/UX</title>
<style>
:root{
 color-scheme:light dark;
 --bg:#F7F4EE;--surface:#FFFFFF;--raised:#F2EEE6;--ink:#252522;--muted:#59574F;--muted-strong:#6C685F;
 --accent:#70502F;--accent-pressed:#594023;--accent-soft:#F2E5D0;--border:#D7D0C4;
 --danger:#9D332B;--success:#1E684F;--on-accent:#FFFFFF;--overlay:rgba(28,26,22,.58);
 --shadow:0 6px 22px rgba(31,28,22,.08);--radius-s:10px;--radius-m:16px;--radius-l:22px;
 --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;--space-6:24px;
 --motion:180ms cubic-bezier(.2,.7,.2,1);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;
}
:root[data-theme="dark"]{color-scheme:dark;--bg:#151614;--surface:#20211F;--raised:#282A27;--ink:#F4F0E8;--muted:#CCC5B8;--muted-strong:#B2AA9D;--accent:#E0BB85;--accent-pressed:#F1CC99;--accent-soft:#3A3023;--border:#464842;--danger:#FFAAA2;--success:#8CD6B8;--on-accent:#20180E;--overlay:rgba(0,0,0,.7);--shadow:0 8px 24px rgba(0,0,0,.25)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#151614;--surface:#20211F;--raised:#282A27;--ink:#F4F0E8;--muted:#CCC5B8;--muted-strong:#B2AA9D;--accent:#E0BB85;--accent-pressed:#F1CC99;--accent-soft:#3A3023;--border:#464842;--danger:#FFAAA2;--success:#8CD6B8;--on-accent:#20180E;--overlay:rgba(0,0,0,.7);--shadow:0 8px 24px rgba(0,0,0,.25)}}
*{box-sizing:border-box}
html,body{width:100%;height:100%;min-height:100dvh;margin:0}
body{background:var(--bg);color:var(--ink);overflow:hidden;line-height:1.45;overscroll-behavior:none}
button,input,select{font:inherit}
button{color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button{cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.55;cursor:not-allowed}
svg{width:22px;height:22px;display:block;flex:none;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.preview-bar{position:relative;z-index:5;display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;padding:10px 14px;background:var(--surface);border-bottom:1px solid var(--border);padding-top:max(10px,env(safe-area-inset-top))}
.brand{display:flex;align-items:center;gap:10px;min-width:0}

.brand-sub{font-size:12px;color:var(--muted);margin-top:2px}
.demo-pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--accent);border-radius:999px;padding:5px 9px;font-size:12px;font-weight:750;letter-spacing:.02em;color:var(--accent);white-space:nowrap}
.demo-dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.controls{grid-column:1/-1;display:flex;gap:8px;align-items:center;min-width:0}
.controls label{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.controls select{flex:1;min-width:0;min-height:44px;border:1px solid var(--border);border-radius:12px;padding:8px 36px 8px 12px;background:var(--bg);color:var(--ink);font-size:14px}
.icon-button,.button{min-height:48px;min-width:48px;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--border);border-radius:14px;background:var(--surface);color:var(--ink);padding:0 14px;transition:transform var(--motion),opacity var(--motion),background var(--motion)}
.icon-button{padding:0;width:48px}
.button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.button.soft{background:var(--accent-soft);border-color:transparent;color:var(--ink);font-weight:650}
.button.danger{background:var(--danger);border-color:var(--danger);color:var(--surface);font-weight:700}
.button.full{width:100%}
.icon-button:active,.button:active,.tab:active{transform:scale(.98)}
#app{display:flex;flex-direction:column;height:calc(100dvh - 112px - env(safe-area-inset-top));min-height:0;background:var(--bg);max-width:720px;margin:0 auto;width:100%;border-left:1px solid var(--border);border-right:1px solid var(--border)}
.app-header{min-height:74px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;background:var(--surface);border-bottom:1px solid var(--border);flex:none}

.header-copy{min-width:0}
.header-title{font-size:17px;line-height:1.25;font-weight:750;letter-spacing:-.02em}
.header-sub{font-size:12px;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.header-actions{display:flex;gap:4px;align-items:center}
.header-actions .icon-button{width:44px;min-width:44px;height:48px;border-color:transparent;background:transparent}
.screen{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.screen.chat-screen{display:flex;flex-direction:column;overflow:hidden}
.sample-ribbon{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;padding:10px 16px 0}
.sample-ribbon strong{font-size:12px;color:var(--accent);letter-spacing:.04em}
.connection-banner{margin:10px 14px 0;padding:10px 12px;border:1px solid var(--danger);border-radius:12px;background:var(--surface);color:var(--danger);display:flex;align-items:center;gap:8px;font-size:13px;font-weight:650}
.messages{flex:1;min-height:0;overflow:auto;padding:10px 14px 18px;display:flex;flex-direction:column;gap:10px;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.date-divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;justify-content:center;margin:8px 0}
.date-divider:before,.date-divider:after{content:"";height:1px;background:var(--border);flex:1;max-width:90px}
.message-row{display:flex;flex-direction:column;max-width:88%;gap:4px}
.message-row.in{align-self:flex-start;align-items:flex-start}
.message-row.out{align-self:flex-end;align-items:flex-end}
.bubble{padding:11px 13px;border-radius:18px;background:var(--surface);border:1px solid var(--border);line-height:1.48;overflow-wrap:anywhere;box-shadow:0 1px 1px rgba(0,0,0,.02)}
.message-row.in .bubble{border-bottom-left-radius:5px}
.message-row.out .bubble{background:var(--accent-soft);border-color:transparent;border-bottom-right-radius:5px}
.message-text{font-size:15px}
.message-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--muted);padding:0 4px}
.message-row.out .message-meta{justify-content:flex-end}
.status-word{color:var(--success);font-weight:650}
.reaction{font-size:13px;border:1px solid var(--border);border-radius:999px;padding:2px 8px;background:var(--surface);color:var(--ink)}
.photo-sample{width:min(230px,62vw);aspect-ratio:4/3;border-radius:13px;overflow:hidden;border:1px solid var(--border);background:linear-gradient(158deg,#D6C2A2 0 25%,#8B8B7A 25% 45%,#3D4B43 45% 72%,#252B29 72%);display:flex;align-items:flex-end;padding:10px;color:white;font-size:12px;font-weight:800;text-shadow:0 1px 3px #000}
.voice-card{min-width:225px;display:flex;align-items:center;gap:9px}
.play-mini{width:44px;height:44px;display:grid;place-items:center;border:1px solid var(--border);border-radius:50%;background:var(--surface);color:var(--ink);flex:none}
.wave{height:28px;display:flex;align-items:center;gap:3px;flex:1}
.wave i{display:block;width:3px;border-radius:99px;background:var(--accent);height:var(--h);opacity:.82}
.voice-info{font-size:12px;color:var(--muted);margin-top:5px}
.composer-wrap{flex:none;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--border);background:var(--surface)}
.composer{display:flex;align-items:center;gap:6px}
.composer .icon-button{width:48px;min-width:48px;border-color:transparent;background:transparent}
.composer input{min-width:0;flex:1;height:48px;border:1px solid var(--border);border-radius:16px;background:var(--bg);color:var(--ink);padding:0 13px;font-size:16px}
.composer input::placeholder{color:var(--muted)}
.send-button{height:48px;width:48px;min-width:48px;border-radius:15px;background:var(--accent);border:1px solid var(--accent);color:var(--on-accent);display:grid;place-items:center}
.bottom-nav{display:flex;align-items:stretch;justify-content:space-around;gap:4px;padding:6px 8px calc(6px + env(safe-area-inset-bottom));border-top:1px solid var(--border);background:var(--surface);flex:none}
.tab{flex:1;min-height:56px;border:1px solid transparent;border-radius:14px;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:650;transition:transform var(--motion),opacity var(--motion),background var(--motion)}
.tab svg{width:21px;height:21px}
.tab.active{background:var(--accent-soft);color:var(--ink);border-color:var(--border)}
.page-pad{padding:16px 14px 22px;display:flex;flex-direction:column;gap:14px}
.section-title{font-size:15px;font-weight:750;letter-spacing:-.01em}
.section-sub{color:var(--muted);font-size:13px;margin-top:4px}
.card{padding:16px;border:1px solid var(--border);border-radius:var(--radius-l);background:var(--surface)}
.relationship-card{background:var(--ink);color:var(--bg);border:1px solid var(--ink);border-radius:22px;padding:20px;position:relative;overflow:hidden}
.relationship-card .kicker{font-size:12px;font-weight:750;letter-spacing:.07em;text-transform:uppercase;color:var(--accent)}
.relationship-card h2{font-size:23px;line-height:1.2;letter-spacing:-.035em;margin:8px 0}
.relationship-card p{font-size:14px;color:var(--bg);opacity:.88;margin:6px 0 0}
.relationship-card .button{margin-top:15px;min-height:48px;background:var(--bg);border-color:var(--bg);color:var(--ink)}
.row-link{min-height:58px;width:100%;display:flex;align-items:center;gap:12px;text-align:left;border:1px solid var(--border);border-radius:16px;padding:10px 12px;background:var(--surface)}
.row-icon{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.row-copy{flex:1;min-width:0}
.row-title{font-size:14px;font-weight:700}
.row-sub{font-size:12px;color:var(--muted);margin-top:3px}
.arrow{color:var(--muted)}
.preview-only{display:inline-flex;align-items:center;border-radius:6px;padding:2px 6px;border:1px solid var(--accent);color:var(--accent);font-size:12px;font-weight:750;letter-spacing:.02em;white-space:nowrap}
.media-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.media-card{overflow:hidden;border:1px solid var(--border);border-radius:16px;background:var(--surface);text-align:left;padding:0;min-width:0}
.media-thumb{aspect-ratio:1.22;background:linear-gradient(145deg,#B9A890,#D5C8B6 48%,#4C5A52 49%,#29312E);display:flex;align-items:flex-end;padding:10px;color:#fff;font-size:12px;font-weight:800;text-shadow:0 1px 3px #000}
.media-thumb.video{background:linear-gradient(145deg,#292D2A,#77715F 48%,#B7A17D)}
.media-info{padding:10px;font-size:13px;font-weight:700}
.filter-row{display:flex;gap:7px;overflow:auto;padding:0 0 2px}
.filter{flex:none;min-height:44px;border:1px solid var(--border);border-radius:999px;padding:0 14px;background:var(--surface);color:var(--muted);font-size:13px;font-weight:650}
.filter.active{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.meter{height:8px;background:var(--raised);border-radius:99px;overflow:hidden;margin-top:10px}
.meter span{display:block;height:100%;width:42%;background:var(--accent);border-radius:inherit}
.center-state{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px 22px;gap:13px}
.state-symbol{width:60px;height:60px;display:grid;place-items:center;border-radius:20px;background:var(--accent-soft);color:var(--accent)}
.state-symbol svg{width:28px;height:28px}
.center-state h2{font-size:20px;line-height:1.25;margin:0;letter-spacing:-.02em}
.center-state p{font-size:14px;color:var(--muted);max-width:300px;margin:0 0 5px}
.center-state .button{margin-top:2px}
.skeleton{height:62px;border:1px solid var(--border);border-radius:15px;background:var(--raised);margin-bottom:10px;opacity:.7}
.skeleton.short{width:66%}
.setting-list{display:flex;flex-direction:column;gap:8px}
.call-stage{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;padding:34px 22px calc(30px + env(safe-area-inset-bottom));background:var(--surface)}
.call-person{display:flex;flex-direction:column;align-items:center;gap:12px;margin:auto 0}
.call-avatar{width:104px;height:104px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);border:1px solid var(--border);font-family:Georgia,serif;font-size:36px;color:var(--accent)}
.call-person h2{font-size:24px;margin:4px 0 0;letter-spacing:-.03em}
.call-person p{font-size:14px;color:var(--muted);margin:0}
.call-actions{display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap}
.call-action{width:64px;min-height:72px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;border:0;background:transparent;font-size:12px;color:var(--muted)}
.call-action .circle{width:56px;height:56px;display:grid;place-items:center;border-radius:50%;background:var(--raised);color:var(--ink)}
.call-action .circle svg{width:24px;height:24px}
.call-action.answer .circle{background:var(--success);color:#10291F}
.call-action.decline .circle{background:var(--danger);color:#FFFFFF}
.preview-note{padding:10px 12px;border:1px solid var(--border);border-radius:12px;background:var(--raised);font-size:13px;color:var(--muted)}
.sheet-backdrop{position:fixed;inset:0;background:var(--overlay);z-index:80;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;background:var(--surface);border:1px solid var(--border);border-bottom:0;border-radius:24px 24px 0 0;padding:12px 16px calc(16px + env(safe-area-inset-bottom));box-shadow:var(--shadow)}
.sheet-handle{width:42px;height:4px;border-radius:999px;background:var(--border);margin:0 auto 15px}
.sheet h2{font-size:18px;margin:0 0 6px}
.sheet p{font-size:13px;color:var(--muted);margin:0 0 14px}
.sheet-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.sheet-actions .button{min-height:64px;flex-direction:column;font-size:13px}
.toast{position:fixed;z-index:100;left:14px;right:14px;bottom:calc(82px + env(safe-area-inset-bottom));max-width:600px;margin:0 auto;background:var(--ink);color:var(--bg);padding:13px 15px;border-radius:14px;box-shadow:var(--shadow);font-size:14px;display:flex;align-items:center;gap:10px;animation:appear var(--motion) both}
.toast strong{color:var(--accent)}
@keyframes appear{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.gate{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px 18px}
.gate-card{width:100%;max-width:360px;display:flex;flex-direction:column;align-items:stretch;gap:14px;text-align:center;border:1px solid var(--border);border-radius:24px;background:var(--surface);padding:24px 20px;box-shadow:var(--shadow)}
.gate-mark{width:62px;height:62px;margin:0 auto 2px;border-radius:21px;display:grid;place-items:center;background:var(--ink);color:var(--bg);font-family:Georgia,serif;font-size:25px}
.gate-card h2{font-size:23px;margin:0}
.gate-card p{font-size:14px;color:var(--muted);margin:0}
.gate-card input{height:52px;text-align:center;border:1px solid var(--border);border-radius:14px;background:var(--bg);color:var(--ink);font-size:18px;letter-spacing:.2em;width:100%;padding:0 12px}
.identity-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.identity{min-height:72px;border:1px solid var(--border);border-radius:14px;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:14px;font-weight:650}
.identity.selected{border-color:var(--accent);background:var(--accent-soft)}
.fingerprint{font:700 14px/1.7 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.04em;padding:15px;border-radius:14px;background:var(--raised);border:1px solid var(--border);overflow-wrap:anywhere;text-align:center}
@media(min-width:760px){body{display:flex;flex-direction:column;align-items:center}.preview-bar{width:100%;max-width:920px;margin:0 auto;padding-left:24px;padding-right:24px;grid-template-columns:1fr auto}.controls{grid-column:2;grid-row:1;max-width:420px}.controls select{min-width:270px}#app{height:calc(100dvh - 88px - env(safe-area-inset-top));border-radius:22px 22px 0 0;overflow:hidden}.app-header{padding-left:20px;padding-right:20px}.messages{padding-left:24px;padding-right:24px}.page-pad{padding:20px 22px 28px}}
@media(max-height:650px){.preview-bar{padding-top:max(6px,env(safe-area-inset-top));padding-bottom:6px}.brand-mark{width:32px;height:32px}.brand-sub{display:none}.app-header{min-height:64px;padding-top:6px;padding-bottom:6px}.avatar{width:40px;height:40px}.composer-wrap{padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom))}.messages{gap:7px}.bubble{padding:9px 11px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>

}
function mediaView(id){
 if(id==="media-preview")return '<div class="page-pad">'+sampleRibbon("Pratinjau sebelum kirim")+'<div class="card"><div class="photo-sample" style="width:100%;aspect-ratio:4/3;justify-content:flex-start">FOTO PILIHAN · CONTOH</div><h2 style="font-size:19px;margin:14px 0 6px">Tinjau sebelum mengirim</h2><p class="section-sub">Foto belum dienkripsi atau diunggah. Pada aplikasi nyata, kompresi dilakukan sebelum enkripsi.</p><div style="display:flex;gap:8px;margin-top:14px"><button class="button primary" style="flex:1" data-action="simulate-send">Kirim · simulasi</button><button class="button" data-action="nav-chat">Batal</button></div></div></div>';
 if(id==="upload-paused")return '<div class="page-pad">'+sampleRibbon("Unggahan gagal simulasi")+'<div class="card"><div class="row-icon">'+icon("alert")+'</div><h2 style="font-size:19px;margin:12px 0 6px">Unggahan terputus</h2><p class="section-sub">Koneksi hilang sebelum contoh media selesai dikirim. Berkas tetap menjadi draf pada aplikasi nyata.</p><div class="meter"><span style="width:46%"></span></div><p class="section-sub">Terunggah 46% · CONTOH</p><div style="display:flex;gap:8px;margin-top:12px"><button class="button primary" style="flex:1" data-action="retry-upload">Coba lagi</button><button class="button" data-action="nav-chat">Buang draf</button></div></div></div>';
 if(id==="media-viewer")return '<div class="page-pad">'+sampleRibbon("Penampil media contoh")+'<div class="card"><div class="photo-sample" style="width:100%;aspect-ratio:3/4;max-height:45dvh;justify-content:flex-start">MEDIA TERENKRIPSI · CONTOH</div><h2 style="font-size:18px;margin:14px 0 4px">Foto bersama</h2><p class="section-sub">Pratinjau tidak mendekripsi atau mengambil media asli.</p><div style="display:flex;gap:8px;margin-top:14px"><button class="button primary" style="flex:1" data-nav="save-gallery">'+icon("download")+' Simpan ke galeri</button><button class="button" data-action="vault-back">Tutup</button></div></div></div>';
 if(id==="save-gallery")return '<div class="page-pad">'+sampleRibbon("Dialog persetujuan simulasi")+'<div class="card" style="text-align:center;padding:24px 18px"><div class="state-symbol" style="margin:0 auto 14px">'+icon("download")+'</div><h2 style="font-size:20px;margin:0 0 8px">Simpan foto ke galeri?</h2><p class="section-sub">Foto harus berhasil didekripsi lebih dulu. Android mungkin meminta izin penyimpanan sesuai versi sistem.</p><div style="display:flex;gap:8px;margin-top:18px"><button class="button primary" style="flex:1" data-action="save-demo">Simpan · simulasi</button><button class="button" style="flex:1" data-action="vault-back">Batal</button></div></div></div>';
 return "";
}
function attachmentView(){return '<div class="page-pad">'+sampleRibbon("Pilihan lampiran simulasi")+'<div class="card"><div class="section-title">Apa yang ingin kamu kirim?</div><p class="section-sub">Pilihan nyata akan membuka pemilih Android. Pratinjau tidak meminta akses file.</p><div class="sheet-actions" style="margin-top:14px"><button class="button" data-action="media-preview">'+icon("image")+'Foto</button><button class="button" data-action="media-preview">'+icon("video")+'Video</button><button class="button" data-action="media-preview">'+icon("file")+'Dokumen</button><button class="button" data-action="nav-chat">'+icon("close")+'Batal</button></div></div></div>'}
function voiceView(){return '<div class="page-pad">'+sampleRibbon("Perekaman bukan fungsi nyata dalam demo")+'<div class="card"><div class="section-title">Voice note</div><p class="section-sub">Kontrol target: tahan untuk merekam, geser ke kiri untuk batal, geser ke atas untuk mengunci rekaman.</p><div style="display:flex;align-items:center;gap:12px;margin:18px 0"><button class="icon-button" data-action="voice-demo" aria-label="Simulasikan putar audio">'+icon("play")+'</button><div class="wave">'+[8,12,18,6,23,15,9,24,12,18,6,21,15,8,18,10,24,5,16].map(function(n){return '<i style="--h:'+n+'px"></i>'}).join("")+'</div></div><div class="section-sub">00:08 · CONTOH gelombang statis</div><div style="display:flex;gap:8px;margin-top:16px"><button class="button" style="flex:1" data-action="nav-chat">Buang</button><button class="button primary" style="flex:1" data-action="simulate-send">Kirim · simulasi</button></div></div><div class="preview-note">Voice note di rilis memerlukan izin mikrofon, rekaman native/Web API, kompresi, enkripsi, dan penanganan interupsi.</div></div>'}
function settingsView(){return '<div class="page-pad">'+sampleRibbon("Preferensi tidak disimpan oleh pratinjau")+'<div class="card"><div class="header-main"><div class="avatar">H</div><div class="header-copy"><div class="header-title">Hamid</div><div class="header-sub">Identitas lokal · CONTOH</div></div></div></div><div class="setting-list"><button class="row-link" data-action="go-pin"><span class="row-icon">'+icon("lock")+'</span><span class="row-copy"><span class="row-title">PIN dan kunci aplikasi</span><span class="row-sub">Ubah PIN atau atur kunci otomatis</span></span>'+icon("chevron")+'</button><button class="row-link" data-action="go-fingerprint"><span class="row-icon">'+icon("shield")+'</span><span class="row-copy"><span class="row-title">Verifikasi sidik jari</span><span class="row-sub">Periksa kode kunci pasangan</span></span>'+icon("chevron")+'</button><button class="row-link" data-action="notification-info"><span class="row-icon">'+icon("phone")+'</span><span class="row-copy"><span class="row-title">Notifikasi</span><span class="row-sub">Izin dan privasi pemberitahuan</span></span>'+icon("chevron")+'</button><button class="row-link" data-action="storage-info"><span class="row-icon">'+icon("vault")+'</span><span class="row-copy"><span class="row-title">Penyimpanan</span><span class="row-sub">Kuota nyata saat layanan aktif</span></span>'+icon("chevron")+'</button><button class="row-link" data-action="lock-info"><span class="row-icon">'+icon("shield")+'</span><span class="row-copy"><span class="row-title">Privasi dan sesi</span><span class="row-sub">Kunci aplikasi berbeda dari kunci pesan</span></span>'+icon("chevron")+'</button></div><button class="button" data-action="nav-together">Kembali ke Kita</button></div>'}
function render(){
 var id=select.value;
 appHeader.innerHTML=headerFor(id);
 var gate=id==="pin"||id==="onboarding";
 bottomNav.innerHTML=nav(id.startsWith("together")||id==="settings"?"together":id.startsWith("vault")||id==="media-viewer"||id==="save-gallery"?"vault":"chat");
 bottomNav.style.display=gate||id==="fingerprint"||id==="key-mismatch"||id.startsWith("call-")?"none":"flex";
 if(gate){appHeader.style.display="none";screen.className="screen";screen.innerHTML=gateView(id)}
 else{
 appHeader.style.display="flex";
 if(id.startsWith("chat"))screen.innerHTML=chatView(id),screen.className="screen chat-screen";
 else if(id.startsWith("together"))screen.innerHTML=togetherView(id),screen.className="screen";
 else if(id.startsWith("vault"))screen.innerHTML=vaultView(id),screen.className="screen";
 else if(id.startsWith("call-"))screen.innerHTML=callView(id),screen.className="screen";
 else if(id==="fingerprint"||id==="key-mismatch")screen.innerHTML=fingerprintView(id),screen.className="screen";
 else if(id==="media-preview"||id==="upload-paused"||id==="media-viewer"||id==="save-gallery")screen.innerHTML=mediaView(id),screen.className="screen";
 else if(id==="attachment")screen.innerHTML=attachmentView(),screen.className="screen";
 else if(id==="voice-note")screen.innerHTML=voiceView(),screen.className="screen";
 else if(id==="settings")screen.innerHTML=settingsView(),screen.className="screen";
 else screen.innerHTML=chatView("chat"),screen.className="screen chat-screen";
 }
}
function go(id){select.value=id;render();screen.scrollTop=0}
function navTo(tab){if(tab==="chat")go("chat");else if(tab==="together")go("together");else if(tab==="vault")go("vault");else go("settings")}
select.addEventListener("change",render);
document.getElementById("theme-toggle").addEventListener("click",function(){
 var root=document.documentElement;var now=root.getAttribute("data-theme");
 root.setAttribute("data-theme",now==="dark"?"light":"dark");
 toast("Tampilan "+(root.getAttribute("data-theme")==="dark"?"gelap":"terang")+" · hanya pratinjau");
});
document.addEventListener("click",function(e){
 var t=e.target.closest("button");if(!t)return;
 if(t.hasAttribute("data-tab")){navTo(t.getAttribute("data-tab"));return}
 if(t.hasAttribute("data-nav")){navTo(t.getAttribute("data-nav"));return}
 if(t.hasAttribute("data-filter")){currentFilter=t.getAttribute("data-filter");render();toast("Filter "+currentFilter+" · CONTOH");return}
 if(t.hasAttribute("data-identity")){selectedIdentity=t.getAttribute("data-identity");render();return}
 var a=t.getAttribute("data-action");if(!a)return;
 if(a==="attachment")go("attachment");
 else if(a==="media-preview")go("media-preview");
 else if(a==="voice-record")go("voice-note");
 else if(a==="call-audio"||a==="call-video")go("call-outgoing");
 else if(a==="call-ended")go("call-ended");
 else if(a==="call-active")go("call-active");
 else if(a==="verified-demo"){go("chat");toast("Simulasi saja · tidak ada kunci yang diverifikasi");}
 else if(a==="retry-fingerprint")go("fingerprint");
 else if(a==="vault-back")go("vault");
 else if(a==="nav-chat")go("chat");
 else if(a==="nav-together")go("together");
 else if(a==="focus-composer"){var input=document.getElementById("message-input");if(input)input.focus();else go("chat")}
 else if(a==="retry"){toast("CONTOH: permintaan tidak dijalankan ke backend");}
 else if(a==="retry-upload"){go("media-preview");toast("Unggahan contoh siap ditinjau lagi");}
 else if(a==="simulate-send"){go("chat");toast("CONTOH: tidak ada pesan atau media yang terkirim");}
 else if(a==="save-demo"){go("media-viewer");toast("CONTOH: galeri perangkat tidak diubah");}
 else if(a==="date-setting"){go("settings");toast("Tanggal jadian belum dikonfirmasi; angka tidak ditampilkan");}
 else if(a==="go-pin")go("pin");
 else if(a==="go-fingerprint")go("fingerprint");
 else if(a==="notification-info")toast("CONTOH: status izin notifikasi belum dibaca");
 else if(a==="storage-info")toast("CONTOH: kuota nyata tidak tersedia di pratinjau");
 else if(a==="lock-info")toast("PIN lokal bukan kunci E2EE");
 else if(a==="voice-demo")toast("CONTOH: tidak ada audio yang direkam atau diputar");
 else if(a==="onboarding-submit"){go("fingerprint");toast("Simulasi: autentikasi dan pembuatan kunci tidak dijalankan");}
 else if(a==="back")go("chat");
 else if(a==="none")return;
 else toast("Simulasi pratinjau · tidak ada data produksi yang berubah");
});
document.addEventListener("submit",function(e){
 if(e.target.id==="composer-form"){e.preventDefault();var input=document.getElementById("message-input");if(!input||!input.value.trim())return;var text=input.value.trim();input.value="";toast("CONTOH: pesan “"+text.replace(/[<>]/g,"") +"” tidak dikirim ke siapa pun");}
 if(e.target.id==="pin-form"){e.preventDefault();go("chat");toast("CONTOH: PIN tidak diperiksa atau disimpan");}
});
document.addEventListener("keydown",function(e){if(e.key==="Escape"){var id=select.value;if(id!=="chat")go("chat")}});
render();
})();
</script>
</body>
</html>
