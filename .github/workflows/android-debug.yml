name: Build Our Space Android Debug APK
on:
  push:
    branches: [main, 'phase-0.5/**', 'phase-1/**', 'phase-2/**', 'phase-3/**', 'phase-4/**', 'phase-5/**', 'phase-6/**', 'phase-7/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Prepare optional Firebase Android configuration
        env:
          FIREBASE_ANDROID_CONFIG_BASE64: ${{ secrets.FIREBASE_ANDROID_CONFIG_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$FIREBASE_ANDROID_CONFIG_BASE64" ]]; then
            {
              echo "VITE_FCM_CONFIGURED=false"
              echo "VITE_FCM_PROJECT_ID="
            } >> "$GITHUB_ENV"
            echo "Firebase client config absent; push remains disabled in this build."
            exit 0
          fi
          python3 - <<'PY'
          import base64, json, os, re
          from pathlib import Path

          try:
              decoded = base64.b64decode(os.environ["FIREBASE_ANDROID_CONFIG_BASE64"], validate=True)
              config = json.loads(decoded)
          except Exception:
              raise SystemExit("Firebase Android config secret is not valid base64 JSON.")
          project_id = config.get("project_info", {}).get("project_id")
          clients = config.get("client", [])
          package_names = [
              client.get("client_info", {}).get("android_client_info", {}).get("package_name")
              for client in clients
          ]
          if not isinstance(project_id, str) or not re.fullmatch(r"[a-z0-9-]{3,100}", project_id):
              raise SystemExit("Firebase config must include a valid project ID.")
          if "com.ourspace.app" not in package_names:
              raise SystemExit("Firebase config must contain the Android package com.ourspace.app.")
          target = Path(os.environ["RUNNER_TEMP"]) / "our-space-google-services.json"
          target.write_bytes(decoded)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write("VITE_FCM_CONFIGURED=true\n")
              env.write("VITE_FCM_PROJECT_ID=" + project_id + "\n")
          print("Firebase client config validated for the expected Android package.")
          PY
      - name: Audit production dependency tree
        run: npm audit --omit=dev --audit-level=high
      - name: Run deterministic protocol tests
        run: npm test
      - name: Build bundled web assets
        run: npm run build
      - name: Generate Android project and sync Capacitor
        run: npx cap add android && npx cap sync android
      - name: Configure optional Firebase Android resources
        run: |
          set -euo pipefail
          CONFIG="$RUNNER_TEMP/our-space-google-services.json"
          if [[ ! -s "$CONFIG" ]]; then
            echo "No Firebase client config; push remains disabled."
            exit 0
          fi
          mkdir -p android/app
          cp "$CONFIG" android/app/google-services.json
          python3 - <<'PY'
          import re
          from pathlib import Path

          root = Path("android/build.gradle")
          app = Path("android/app/build.gradle")
          if not root.is_file() or not app.is_file():
              raise SystemExit("Generated Android Gradle files were not found.")
          root_text = root.read_text()
          app_text = app.read_text()

          if "com.google.gms:google-services" not in root_text:
              match = re.search(r"(?s)(buildscript\s*\{.*?dependencies\s*\{)", root_text)
              if not match:
                  raise SystemExit("Could not find root Gradle buildscript dependencies.")
              root_text = root_text[:match.end()] + "\n        classpath 'com.google.gms:google-services:4.4.2'" + root_text[match.end():]
          if "com.google.gms.google-services" not in app_text:
              plugin = re.search(r"(?m)^apply plugin: ['\"]com\.android\.application['\"]\s*$", app_text)
              if not plugin:
                  raise SystemExit("Could not find the Android application plugin declaration.")
              app_text = app_text[:plugin.end()] + "\napply plugin: 'com.google.gms.google-services'" + app_text[plugin.end():]
          root.write_text(root_text)
          app.write_text(app_text)
          print("Configured optional Google Services plugin without printing Firebase credentials.")
          PY
      - name: Disable backup for Keystore-bound identity storage
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path("android/app/src/main/AndroidManifest.xml")
          if not path.is_file():
              raise SystemExit("Generated AndroidManifest.xml was not found.")
          text = path.read_text()
          start = text.find("<application")
          end = text.find(">", start)
          if start < 0 or end < 0:
              raise SystemExit("Could not find the generated application tag.")
          tag = text[start:end + 1]
          tag, count = re.subn(r'android:allowBackup="[^"]*"', 'android:allowBackup="false"', tag, count=1)
          if count == 0:
              tag = tag[:-1] + ' android:allowBackup="false">'
          text = text[:start] + tag + text[end + 1:]
          path.write_text(text)
          if 'android:allowBackup="false"' not in path.read_text():
              raise SystemExit("Failed to disable backup for Keystore-bound app identity.")
          print("Disabled Android app backup for identity data tied to Android Keystore.")
          PY
      - name: Declare microphone and camera permissions for WebRTC
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/src/main/AndroidManifest.xml")
          if not path.is_file():
              raise SystemExit("Generated AndroidManifest.xml was not found.")
          text = path.read_text()
          start = text.find("<application")
          if start < 0:
              raise SystemExit("Could not find Android application manifest node.")
          permissions = [
              '    <uses-permission android:name="android.permission.RECORD_AUDIO" />',
              '    <uses-permission android:name="android.permission.CAMERA" />',
          ]
          for permission in permissions:
              name = permission.split('"')[1]
              if name not in text:
                  text = text[:start] + permission + "\\n" + text[start:]
                  start = text.find("<application")
          path.write_text(text)
          for name in ("android.permission.RECORD_AUDIO", "android.permission.CAMERA"):
              if name not in path.read_text():
                  raise SystemExit("Failed to declare " + name)
          print("Declared runtime microphone and camera permissions; user consent is still required by Android.")
          PY
      - name: Inject maintained native Keystore plugin
        run: |
          mkdir -p android/app/src/main/java/com/ourspace/app
          cp android-native/src/main/java/com/ourspace/app/OurSpaceKeyStorePlugin.java android/app/src/main/java/com/ourspace/app/
          cp android-native/src/main/java/com/ourspace/app/MainActivity.java android/app/src/main/java/com/ourspace/app/
      - name: Configure persistent APK signing
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APP_VERSION_CODE: ${{ github.run_number }}
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_SIGNING_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo "::error title=Stable APK signing is not configured::Add repository Actions secrets ANDROID_SIGNING_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD. Refusing to create another APK with an ephemeral signature."
            exit 1
          fi
          mkdir -p android/app
          printf '%s' "$ANDROID_SIGNING_KEYSTORE_BASE64" | base64 --decode > android/app/our-space-signing.jks
          test -s android/app/our-space-signing.jks || { echo "::error::Signing keystore could not be decoded."; exit 1; }
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("android/app/build.gradle")
          if not path.is_file():
              raise SystemExit("Generated Android app/build.gradle was not found.")
          text = path.read_text()
          version_code = os.environ.get("APP_VERSION_CODE", "")
          if not version_code.isdigit() or int(version_code) < 1:
              raise SystemExit("APP_VERSION_CODE must be a positive integer.")

          version_matches = list(re.finditer(r"(?m)^(\s*versionCode\s+)\d+\s*$", text))
          if len(version_matches) != 1:
              raise SystemExit(f"Expected one versionCode declaration, found {len(version_matches)}.")
          text = re.sub(
              r"(?m)^(\s*versionCode\s+)\d+\s*$",
              lambda match: match.group(1) + version_code,
              text,
              count=1,
          )
          name_matches = list(re.finditer(r"(?m)^(\s*versionName\s+).*$", text))
          if len(name_matches) != 1:
              raise SystemExit(f"Expected one versionName declaration, found {len(name_matches)}.")
          text = re.sub(
              r"(?m)^(\s*versionName\s+).*$",
              lambda match: match.group(1) + f'"0.1.{version_code}"',
              text,
              count=1,
          )

          if "our-space-signing.jks" in text:
              raise SystemExit("Stable signing appears already configured; refusing to inject it twice.")
          match = re.search(r"(?m)^(\s*)buildTypes\s*\{", text)
          if not match:
              raise SystemExit("Could not find the generated buildTypes block.")

          indent = match.group(1)
          signing = (
              f'{indent}signingConfigs {{\n'
              f'{indent}    stable {{\n'
              f'{indent}        storeFile file("our-space-signing.jks")\n'
              f'{indent}        storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")\n'
              f'{indent}        keyAlias System.getenv("ANDROID_KEY_ALIAS")\n'
              f'{indent}        keyPassword System.getenv("ANDROID_KEY_PASSWORD")\n'
              f'{indent}    }}\n'
              f'{indent}}}\n\n'
          )
          debug = (
              f'{indent}buildTypes {{\n'
              f'{indent}    debug {{\n'
              f'{indent}        signingConfig signingConfigs.stable\n'
              f'{indent}    }}\n'
          )
          text = text[:match.start()] + signing + debug + text[match.end():]
          release_match = re.search(r"(?m)^(\\s*)release\\s*\\{\\s*$", text)
          if not release_match:
              raise SystemExit("Could not find the generated release build type.")
          release_indent = release_match.group(1)
          release_open = release_match.end()
          text = (
              text[:release_open]
              + "\\n"
              + release_indent
              + "    signingConfig signingConfigs.stable"
              + text[release_open:]
          )
          path.write_text(text)
          print(f"Configured stable APK signing for debug and release; versionCode={version_code}.")
          PY
      - name: Build debug and release APKs with stable signature
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleDebug assembleRelease
      - name: Verify stable APK signature and package metadata
        run: |
          set -euo pipefail
          DEBUG_APK="android/app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_APK="android/app/build/outputs/apk/release/app-release.apk"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -s "$DEBUG_APK" || { echo "::error::Debug APK artifact is missing."; exit 1; }
          test -s "$RELEASE_APK" || { echo "::error::Release APK artifact is missing."; exit 1; }
          test -n "$SDK_ROOT" || { echo "::error::Android SDK root is unavailable."; exit 1; }
          BUILDTOOLS="$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$BUILDTOOLS/apksigner" || { echo "::error::apksigner is unavailable."; exit 1; }
          test -x "$BUILDTOOLS/aapt" || { echo "::error::aapt is unavailable."; exit 1; }
          for APK in "$DEBUG_APK" "$RELEASE_APK"; do
            "$BUILDTOOLS/apksigner" verify --verbose --print-certs "$APK"
            BADGING="$("$BUILDTOOLS/aapt" dump badging "$APK")"
            EXPECTED="package: name='com.ourspace.app' versionCode='$GITHUB_RUN_NUMBER' versionName='0.1.$GITHUB_RUN_NUMBER'"
            grep -F "$EXPECTED" <<< "$BADGING" || { echo "::error::Unexpected package or version metadata in $APK."; exit 1; }
            PERMISSIONS="$("$BUILDTOOLS/aapt" dump permissions "$APK")"
            grep -F "android.permission.RECORD_AUDIO" <<< "$PERMISSIONS" || { echo "::error::Microphone permission missing in $APK."; exit 1; }
            grep -F "android.permission.CAMERA" <<< "$PERMISSIONS" || { echo "::error::Camera permission missing in $APK."; exit 1; }
          done
          DEBUG_CERT="$("$BUILDTOOLS/apksigner" verify --print-certs "$DEBUG_APK" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print $2}')"
          RELEASE_CERT="$("$BUILDTOOLS/apksigner" verify --print-certs "$RELEASE_APK" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print $2}')"
          test -n "$DEBUG_CERT" -a -n "$RELEASE_CERT" || { echo "::error::Could not extract signing certificate digest."; exit 1; }
          test "$DEBUG_CERT" = "$RELEASE_CERT" || { echo "::error::Debug and release APK signatures differ."; exit 1; }
          echo "Stable signer SHA-256: $RELEASE_CERT"
          echo "APK SHA-256:"
          sha256sum "$DEBUG_APK" "$RELEASE_APK"
      - name: Remove signing keystore from workspace
        if: always()
        run: rm -f android/app/our-space-signing.jks
      - uses: actions/upload-artifact@v4
        with:
          name: our-space-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: our-space-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
