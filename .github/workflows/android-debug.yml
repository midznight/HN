name: Build Our Space Android Debug APK
on:
  push:
    branches: [main, 'phase-1/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Install pinned dependencies
        run: npm install --no-audit --no-fund
      - name: Build bundled web assets
        run: npm run build
      - name: Generate Android project and sync Capacitor
        run: npx cap add android && npx cap sync android
      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: our-space-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
