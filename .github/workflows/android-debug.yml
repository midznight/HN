name: Build Our Space Android Debug APK
on:
  push:
    branches: [main, 'phase-1/**', 'phase-2/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Install dependencies and refresh lock
        run: npm install --no-audit --no-fund
      - name: Commit refreshed lockfile to Phase 2 branch
        if: github.ref == 'refs/heads/phase-2/e2ee-text-chat'
        continue-on-error: true
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "build: refresh lockfile for patched Capacitor runtime"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Run deterministic protocol tests
        run: npm test
      - name: Build bundled web assets
        run: npm run build
      - name: Generate Android project and sync Capacitor
        run: npx cap add android && npx cap sync android
      - name: Inject maintained native Keystore plugin
        run: |
          mkdir -p android/app/src/main/java/com/ourspace/app
          cp android-native/src/main/java/com/ourspace/app/OurSpaceKeyStorePlugin.java android/app/src/main/java/com/ourspace/app/
          cp android-native/src/main/java/com/ourspace/app/MainActivity.java android/app/src/main/java/com/ourspace/app/
      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: our-space-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
