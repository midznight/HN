name: Build Android APK (debug)

on:
  push:
    branches:
      - "**"
    paths:
      - "index.html"
      - "prototipe UI.html"
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "tailwind.config.cjs"
      - "vite.config.js"
      - "capacitor.config.json"
      - ".github/workflows/android-debug.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.16.0"
          package-manager-cache: false
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependency graph
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
      - name: Test local shell and version pins
        run: npm test
      - name: Build local web assets
        run: npm run build
      - name: Add Android platform
        run: npx cap add android
      - name: Configure Android keyboard resizing
        run: node scripts/prepare-android.mjs
      - name: Synchronize Capacitor assets
        run: npx cap sync android
      - name: Build APK debug
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon assembleDebug
      - name: Verify APK output
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: our-space-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Commit initial npm lockfile, if generated
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          if [ ! -s package-lock.json ]; then
            echo "No generated npm lockfile found."
            exit 0
          fi
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: lock phase 1 npm dependency graph"
          git push origin "HEAD:${GITHUB_REF_NAME}"
