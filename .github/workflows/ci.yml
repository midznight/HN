name: Our Space — CI

on:
  push:
    branches:
      - main
      - 'phase-0.5/**'
      - 'phase-1/**'
      - 'phase-2/**'
      - 'phase-3/**'
      - 'phase-4/**'
      - 'phase-5/**'
      - 'phase-6/**'
      - 'phase-7/**'
  pull_request:
    branches:
      - main
      - 'phase-0.5/**'
      - 'phase-1/**'
      - 'phase-2/**'
      - 'phase-3/**'
      - 'phase-4/**'
      - 'phase-5/**'
      - 'phase-6/**'
      - 'phase-7/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: our-space-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-web:
    name: Tests, security contracts, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Check JavaScript syntax
        run: find src -maxdepth 1 -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run unit and security-contract tests
        run: npm test
      - name: Build production web bundle
        run: npm run build
      - name: Verify deployable files exist
        run: test -s dist/index.html && test -s dist/assets/*
